<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte de Terreno V3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#1f2937}
header{background:#17324d;color:#fff;padding:16px 18px}header h1{margin:0 0 4px;font-size:21px}header p{margin:0;font-size:13px}
main{max-width:820px;margin:auto;padding:14px 12px 80px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #ccd3da;border-radius:9px;padding:11px;font-size:15px}textarea{min-height:105px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;font-size:14px}.primary{background:#17324d;color:#fff;width:100%;font-size:16px}.secondary{background:#e8edf2;color:#17324d}
.item{display:grid;grid-template-columns:70px 90px 1fr 38px;gap:7px;margin:8px 0}.item button{padding:0;background:#f0dede;color:#9b2222}.muted{color:#64748b;font-size:13px}.status{padding:10px;border-radius:9px;font-size:13px;margin-top:10px;background:#eef2f7}.hidden{display:none}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.active{background:#17324d;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#eef2f7;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:22px}
.report{border-top:1px solid #e5e7eb;padding:12px 0}.report:first-child{border-top:0}.report h3{margin:0 0 5px;font-size:15px}.report p{margin:4px 0;font-size:13px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef2f7;font-size:12px}.photos img{width:95px;height:75px;object-fit:cover;border-radius:8px;margin:4px}
@media(max-width:560px){.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.item{grid-template-columns:60px 78px 1fr 36px}}
</style></head><body>
<header><h1>Reporte de Terreno V3</h1><p>Captura en terreno y recepción central</p></header><main>
<div class="tabs"><button id="tw" class="active" onclick="tab(1)">📱 Trabajador</button><button id="tl" onclick="tab(0)">💻 Logística</button></div>
<section id="trabajador">
<div class="card"><label>Lugar</label><input id="lugar" list="lugaresList" placeholder="Escribe parte del lugar, por ejemplo: bri"><datalist id="lugaresList"></datalist>
<div class="muted">Busca escribiendo algunas letras.</div><div style="margin-top:9px"><label style="font-weight:600"><input id="otro" type="checkbox" onchange="toggleOtro()"> Otro lugar</label></div>
<div id="otroBox" class="hidden"><input id="otroLugar" placeholder="Escribe el lugar de trabajo"></div></div>
<div class="card"><div class="row"><div><label>Fecha inicio</label><input id="fi" type="date"></div><div><label>Fecha término</label><input id="ft" type="date"></div></div>
<div class="row" style="margin-top:12px"><div><label>Hora inicio</label><input id="hi" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5"></div><div><label>Hora término</label><input id="ht" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5"></div></div>
<div style="margin-top:12px;max-width:180px"><label>Personas</label><input id="personas" type="number" min="1" value="2"></div></div>
<div class="card"><label>Trabajo realizado</label><textarea id="trabajo" placeholder="Describe brevemente el trabajo realizado..."></textarea></div>
<div class="card"><label>Materiales <span class="muted">(opcional)</span></label><div id="mat"></div><button class="secondary" onclick="add('mat','Material')">+ Agregar material</button></div>
<div class="card"><label>Maquinaria / equipos <span class="muted">(opcional)</span></label><div id="maq"></div><button class="secondary" onclick="add('maq','Equipo / maquinaria')">+ Agregar maquinaria</button></div>
<div class="card"><label>Fotografías <span class="muted">(opcional)</span></label><input id="fotos" type="file" accept="image/*" multiple><div class="muted">Hasta 8 fotografías.</div></div>
<div class="card"><label>Estado</label><select id="estado"><option>Terminado</option><option>En proceso</option><option>Pendiente</option></select></div>
<div class="card"><button class="primary" onclick="enviar()">ENVIAR REPORTE</button><div id="status" class="status">Con conexión se envía a recepción central. Sin conexión queda pendiente en este teléfono.</div></div>
<div class="card"><label>Reportes pendientes en este teléfono</label><div id="pend" class="muted">Sin pendientes.</div></div>
</section>
<section id="logistica" class="hidden">
<div class="card"><div class="grid"><div class="metric"><b id="mt">0</b>Total</div><div class="metric"><b id="mh">0</b>Hoy</div><div class="metric"><b id="mp">0</b>En proceso</div><div class="metric"><b id="mpe">0</b>Pendientes</div></div></div>
<div class="card"><label>Buscar</label><input id="q" placeholder="Lugar, ID o trabajo"><div class="row" style="margin-top:10px"><div><label>Desde</label><input id="desde" type="date"></div><div><label>Hasta</label><input id="hasta" type="date"></div></div>
<div style="margin-top:10px"><label>Estado</label><select id="est"><option value="">Todos</option><option>Terminado</option><option>En proceso</option><option>Pendiente</option></select></div>
<button class="primary" style="margin-top:10px" onclick="cargar()">ACTUALIZAR</button></div>
<div class="card"><label>Reportes recibidos</label><div id="lista" class="muted">Cargando...</div></div>
</section></main>
<script>
const lugares=["G 26 REPRODUCCIÓN", "STUD TANTEHUE", "SE SITIO 9", "SE SITIO 3", "SE SITIO 4", "SE SITIO 1", "SE SITIO 2", "SE SITIO 7", "SE SITIO 5", "SE SITIO 6", "SE SITIO 8", "G 14 REPRODUCCIÓN", "G 22 REPRODUCCIÓN", "G 16 REPRODUCCIÓN", "G 15 REPRODUCCIÓN", "G 23 REPRODUCCIÓN", "G 10 REPRODUCCIÓN", "G 24 REPRODUCCIÓN", "G 20 REPRODUCCIÓN", "G 21 REPRODUCCIÓN", "G 17 REPRODUCCIÓN", "G 19 REPRODUCCIÓN", "G 18 REPRODUCCIÓN", "DV LA MINA", "DV LOS TATAS", "DV DIVISADERO", "DV LAS BRISAS", "DV POCILLAS", "DV DON SATA", "DV EL RETORNO", "DV CASTROL", "DV CONCEJALES", "DV PIEDRA DEL JOTE", "DV EL ALCALDE", "DV MR DIC", "DV LA NORIA", "DV PIEDRA DEL TRARO", "DV EL MONTE", "DV MAITENLAHUE", "DV EL YALI", "DV EL MILAGRO", "DV MANZO", "DV ELHUE", "DV CORNECHE", "DV EL TÓTEM", "ENG CHANCÓN 1", "ENG CHANCÓN 2", "ENG EL CARMEN", "ENG LOS GOMEROS", "ENG LA MARAVILLA", "ENG EL QUISCO", "ENG EL ALMENDRO", "ENG ESMERALDA", "ENG TOTIHUE", "ENG. LA LECHERIA", "ENG ARBOLEDA", "Sitio Don Charles", "SITIO RINCÓN DE ABRA", "Sitio La Leonera", "G 6 REPRODUCCIÓN", "G 25 REPRODUCCIÓN", "G 8 REPRODUCCIÓN", "G 5 REPRODUCCIÓN", "G 28 REPRODUCCIÓN", "G 12 REPRODUCCIÓN", "STUD RAMIRANA", "STUD SANTA ROSA", "COYA 2 REPRODUCCIÓN", "COYA 1 REPRODUCCIÓN", "TESTAJE", "G 3 REPRODUCCIÓN", "G 4 REPRODUCCIÓN", "G 9 REPRODUCCIÓN", "G 13", "Cuarentena Idahue", "DV EL MIRADOR", "DV El litre", "DV Rapel", "ENG LOS ALAMOS", "ENG EL ESTERO", "ENG HONORABLE", "ENG LA CAÑA", "ENG LA COPA", "ENG LA TOSCA", "ENG EL PEUMO", "ENG EL ESPINO", "DV LOS LLANOS", "DV LAS MURALLAS", "DV LOS CLONQUIS", "DV VARILLAS", "DV SAN MANUEL", "DV LOS CURUROS", "DV BARRANCAS", "DV EL CAPRICHO", "BIODIG. CORNECHE", "BIODIG. LA ESTRELLA", "BIODIG. LAS PALMAS GR.21", "BIODIG. PERALILLO", "BIODIG. POCILLAS", "BIODIG. RAMIRANA", "BIODIG. SANTA ROSA", "PL COMP. LA ESTRELLA", "PLANTA COMP TANTEHUE", "PLTA COMP MAITENLAHU", "PT. COMP. LA MANGA", "PT. COMP. LA MANGA 2", "PTA COMP VALDEBENITO", "PL TR RILES TANTEHUE", "PT. RILES LA ESTRELLA", "PT. RILES LA MANGA", "PT. RILES MAITENLAHUE", "PT. RILES PERALILLO", "PT. RILES POCILLAS", "PT. RILES RAMIRANA", "PT. RILES VALDEBENIT", "OF CENTRAL RGUA", "STT ARBOLEDA", "STT CASTILLO 6", "STT CASTILLO 8", "STT CHANCÓN 1", "STT CHANCÓN 2", "STT DON CHARLES", "STT EL ALMENDRO", "STT EL CARMEN", "STT EL QUISCO", "STT GOMEROS", "STT GR 9 LA HIGUERA", "STT LOICA ESPINO", "STT LOICA PEUMO", "STT LONGOVILO G14", "STT LONGOVILO G15", "STT LONGOVILO G16", "STT LONGOVILO G22", "STT RINCON DE ABRA", "STT TOTIHUE", "BIODIG. ESTRELLA 1", "BIODIG. PALMAS GR.21", "PT. RILES ESTRELLA", "PT. RILES MAITENLAH", "OCR"];
const $=id=>document.getElementById(id);
function init(){ $("lugaresList").innerHTML=lugares.map(x=>`<option value="${esc(x)}"></option>`).join("");let d=new Date(),z=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);$("fi").value=z;$("ft").value=z;pend();cargar();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function tab(worker){$("trabajador").classList.toggle("hidden",!worker);$("logistica").classList.toggle("hidden",worker);$("tw").classList.toggle("active",worker);$("tl").classList.toggle("active",!worker);if(!worker)cargar();}
function toggleOtro(){$("otroBox").classList.toggle("hidden",!$("otro").checked);}
function add(id,ph){let d=document.createElement("div");d.className="item";d.innerHTML=`<input type="number" min="0" step="0.01" placeholder="Cant."><input placeholder="Unidad"><input placeholder="${ph}"><button onclick="this.parentElement.remove()">×</button>`;$(id).appendChild(d);}
function norm(id){let e=$(id),v=e.value.replace(/\D/g,"");if(v.length===3)v="0"+v;if(v.length===4)e.value=v.slice(0,2)+":"+v.slice(2);}
["hi","ht"].forEach(id=>$(id).addEventListener("blur",()=>norm(id)));
function items(id){return [...document.querySelectorAll("#"+id+" .item")].map(r=>{let i=r.querySelectorAll("input");return {cantidad:i[0].value,unidad:i[1].value,descripcion:i[2].value}}).filter(x=>x.descripcion);}
function build(){norm("hi");norm("ht");let otro=$("otro").checked,lugar=otro?$("otroLugar").value.trim():$("lugar").value.trim(),rx=/^([01]\d|2[0-3]):([0-5]\d)$/;
if(!lugar)throw Error("Escribe o selecciona un lugar, o marca OTRO LUGAR.");if(!otro&&!lugares.includes(lugar))throw Error("El lugar escrito no está en el catálogo.");if(!$("trabajo").value.trim())throw Error("Ingresa el trabajo realizado.");if(!rx.test($("hi").value)||!rx.test($("ht").value))throw Error("Ingresa la hora como HH:MM, por ejemplo 08:30.");
return {id:"RT-"+Date.now()+"-"+Math.random().toString(16).slice(2),lugar,fechaInicio:$("fi").value,fechaTermino:$("ft").value,horaInicio:$("hi").value,horaTermino:$("ht").value,personas:$("personas").value,trabajo:$("trabajo").value.trim(),materiales:items("mat"),maquinaria:items("maq"),estado:$("estado").value,creadoLocal:new Date().toISOString()};}
async function enviar(){let r;try{r=build();let fd=new FormData();fd.append("report",JSON.stringify(r));[...$("fotos").files].slice(0,8).forEach(f=>fd.append("fotos",f,f.name));let x=await fetch("/api/reports",{method:"POST",body:fd});if(!x.ok)throw Error("servidor");$("status").innerHTML="<strong>✓ Reporte recibido por recepción central.</strong>";limpiar();}catch(e){if(e.message==="servidor"||e.name==="TypeError"){try{r=r||build();let a=JSON.parse(localStorage.getItem("pendientesTerreno")||"[]");a.push(r);localStorage.setItem("pendientesTerreno",JSON.stringify(a));$("status").innerHTML="<strong>📵 Sin conexión.</strong> Guardado en este teléfono; se reintentará al recuperar conexión.";limpiar();pend();}catch(x){alert(x.message)}}else alert(e.message);}}
function limpiar(){$("trabajo").value="";$("mat").innerHTML="";$("maq").innerHTML="";$("fotos").value="";$("otro").checked=false;toggleOtro();}
function pend(){let a=JSON.parse(localStorage.getItem("pendientesTerreno")||"[]");$("pend").innerHTML=a.length?a.map(r=>`<div class="report"><b>${esc(r.lugar)}</b><br>${esc(r.fechaInicio)} · ${esc(r.horaInicio)}–${esc(r.horaTermino)}<br><span class="muted">${esc(r.id)} · pendiente</span></div>`).join(""):"Sin pendientes.";}
async function sync(){let a=JSON.parse(localStorage.getItem("pendientesTerreno")||"[]"),rest=[];for(let r of a){try{let fd=new FormData();fd.append("report",JSON.stringify(r));let x=await fetch("/api/reports",{method:"POST",body:fd});if(!x.ok)throw Error();}catch(e){rest.push(r)}}localStorage.setItem("pendientesTerreno",JSON.stringify(rest));pend();}
addEventListener("online",sync);setInterval(sync,30000);
async function cargar(){try{let p=new URLSearchParams();[["q","q"],["desde","desde"],["hasta","hasta"],["estado","est"]].forEach(a=>$(a[1]).value&&p.set(a[0],$(a[1]).value));let x=await fetch("/api/reports?"+p),d=await x.json();$("mt").textContent=d.length;let h=new Date().toISOString().slice(0,10);$("mh").textContent=d.filter(r=>r.fechaInicio===h).length;$("mp").textContent=d.filter(r=>r.estado==="En proceso").length;$("mpe").textContent=d.filter(r=>r.estado==="Pendiente").length;$("lista").innerHTML=d.length?d.map(r=>`<div class="report"><h3>${esc(r.lugar)} <span class="badge">${esc(r.estado)}</span></h3><p><b>${esc(r.fechaInicio)}</b> · ${esc(r.horaInicio)}–${esc(r.horaTermino)} · ${esc(r.personas)} personas</p><p>${esc(r.trabajo)}</p><p class="muted">${r.materiales.length} materiales · ${r.maquinaria.length} equipos · ${r.fotos.length} fotos · ${esc(r.id)}</p>${r.fotos.length?`<div class="photos">${r.fotos.map(f=>`<a href="${f.url}" target="_blank"><img src="${f.url}"></a>`).join("")}</div>`:""}</div>`).join(""):"No hay reportes."}catch(e){$("lista").innerHTML="Recepción central no disponible. Verifique que el servidor esté ejecutándose.";}}
init();
</script></body></html>
