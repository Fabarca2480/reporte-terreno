services:
  - type: web
    name: reporte-terreno
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    numInstances: 1

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATA_DIR
        value: /var/data

      - key: UPLOADS_DIR
        value: /var/data/uploads

      - key: ADMIN_PIN
        sync: false

      - key: SESSION_SECRET
        generateValue: true

    disk:
      name: reportes-data
      mountPath: /var/data
      sizeGB: 1