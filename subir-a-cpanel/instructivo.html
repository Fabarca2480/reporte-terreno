<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instructivo: Cómo usar Reporte de Terreno - MYC SpA</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;display:flex;flex-direction:column}
header{background:#17324d;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid #334155}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
.brand h1{margin:0;font-size:18px;color:#fff}
.brand p{margin:2px 0 0;font-size:12px;color:#cbd5e1}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
button,a.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,opacity .15s}
button:active,a.btn:active{transform:scale(.98)}
.btn-play{background:#10b981;color:#052e16}
.btn-print{background:#334155;color:#fff}
.btn-app{background:#3b82f6;color:#fff}
main{max-width:960px;width:100%;margin:auto;padding:20px 14px 40px;flex:1}
.progress-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.step-pill{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:10px 8px;border-radius:10px;text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s}
.step-pill.active{background:#10b981;color:#052e16;border-color:#10b981;box-shadow:0 0 15px #10b98144}
.slide-card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:26px;display:grid;grid-template-columns:1.3fr .9fr;gap:28px;align-items:center;box-shadow:0 10px 30px #0006}
.badge-step{display:inline-block;background:#3b82f622;color:#60a5fa;border:1px solid #3b82f655;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:800;margin-bottom:10px}
.slide-info h2{margin:0 0 10px;font-size:24px;color:#fff;line-height:1.25}
.slide-info p.lead{margin:0 0 16px;font-size:15px;color:#cbd5e1;line-height:1.5}
.points{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.point{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;color:#e2e8f0}
.point b{color:#38bdf8}
.tip-box{background:#f59e0b18;border:1px solid #f59e0b66;color:#fde68a;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.4}
/* Simulador de teléfono */
.phone-frame{width:270px;margin:auto;background:#f3f5f7;color:#1f2937;border-radius:34px;border:6px solid #475569;overflow:hidden;box-shadow:0 12px 30px #0008}
.phone-hdr{background:#17324d;color:#fff;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
.phone-hdr b{font-size:13px;display:block}
.phone-hdr span{font-size:10.5px;opacity:.8}
.p-net{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:#10b981;color:#fff}
.p-net.off{background:#f59e0b;color:#111827}
.phone-body{padding:12px;min-height:310px;display:flex;flex-direction:column;gap:9px;font-size:12px}
.p-card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 4px #0001}
.p-label{font-weight:700;font-size:11.5px;margin-bottom:5px;color:#1e293b}
.p-input{border:1px solid #cbd5e1;border-radius:7px;padding:7px 9px;background:#fff;font-weight:600;color:#0f172a;font-size:12px}
.p-btn{background:#17324d;color:#fff;text-align:center;padding:9px;border-radius:8px;font-weight:700;font-size:12px}
.p-btn-sec{background:#e2e8f0;color:#17324d;text-align:center;padding:7px;border-radius:7px;font-weight:700;font-size:11.5px;margin-top:6px}
.pulse{animation:pulseAnim 1.8s infinite}
@keyframes pulseAnim{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #10b98188}50%{transform:scale(1.03);box-shadow:0 0 0 8px #10b98100}}
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.nav-btn{background:#334155;color:#fff;padding:12px 20px;font-size:14px}
.nav-btn.primary-nav{background:#10b981;color:#052e16}
/* Vista de impresión (muestra los 5 pasos juntos en hoja blanca para PDF) */
#printAll{display:none}
@media(max-width:760px){
  .slide-card{grid-template-columns:1fr;padding:18px}
  .progress-bar{grid-template-columns:repeat(5,1fr);gap:4px}
  .step-pill{font-size:11px;padding:8px 4px}
}
@media print{
  body{background:#fff;color:#0f172a}
  header,.progress-bar,.slide-card,.nav-bar{display:none!important}
  #printAll{display:block!important;padding:10px}
  .print-step{border:1px solid #cbd5e1;border-radius:12px;padding:14px 16px;margin-bottom:12px;page-break-inside:avoid}
  .print-step h3{margin:0 0 6px;color:#17324d;font-size:16px}
  .print-step ul{margin:6px 0;padding-left:20px;font-size:13px;line-height:1.45}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="icon-192.png" alt="MYC" onerror="this.style.display='none'">
    <div>
      <h1>Guía Rápida: Reporte de Terreno</h1>
      <p>Inversiones y Mantenimiento MYC SpA · Instructivo para Trabajadores</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="playBtn" class="btn-play" onclick="toggleAutoPlay()">▶️ Ver como Video (Automático)</button>
    <button class="btn-print" onclick="window.print()">🖨️ Descargar PDF / Imprimir</button>
    <a href="./" class="btn btn-app">🚀 Abrir Aplicación</a>
  </div>
</header>

<main>
  <div class="progress-bar" id="pills"></div>

  <div class="slide-card">
    <div class="slide-info">
      <span class="badge-step" id="sBadge">PASO 1 DE 5</span>
      <h2 id="sTitle"></h2>
      <p class="lead" id="sDesc"></p>
      <div class="points" id="sPoints"></div>
      <div class="tip-box" id="sTip"></div>
    </div>

    <div>
      <div class="phone-frame">
        <div class="phone-hdr">
          <div>
            <b>Reporte de Terreno</b>
            <span>MYC SpA</span>
          </div>
          <div id="pNet" class="p-net">🟢 En línea</div>
        </div>
        <div class="phone-body" id="pBody"></div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" onclick="prev()">⬅ Paso Anterior</button>
    <span id="counterTxt" style="font-weight:700;color:#94a3b8">Paso 1 de 5</span>
    <button class="nav-btn primary-nav" onclick="next()">Siguiente Paso ➔</button>
  </div>
</main>

<!-- Versión completa para Imprimir / Guardar en PDF -->
<div id="printAll">
  <h1 style="color:#17324d;margin:0 0 4px">INSTRUCTIVO: APLICACIÓN DE REPORTE DE TERRENO - MYC SPA</h1>
  <p style="margin:0 0 16px;color:#475569;font-size:13px">Enlace oficial: <b>https://reporte.mycmantencion.cl/</b></p>
  <div id="printStepsContainer"></div>
</div>

<script>
const SLIDES = [
  {
    short: "1. Instalar App",
    badge: "PASO 1 DE 5 · INSTALAR EN EL CELULAR",
    title: "Instala la aplicación en tu pantalla de inicio",
    desc: "Para no tener que abrir el navegador cada vez, deja instalada la App como un ícono directo en tu teléfono:",
    points: [
      "1️⃣ Toca el link <b>https://reporte.mycmantencion.cl/</b> que recibiste por WhatsApp.",
      "2️⃣ Si se abre dentro de WhatsApp, toca el botón verde <b>\"Abrir en Chrome\"</b> (en iPhone abre en <b>Safari</b>).",
      "3️⃣ Arriba verás un recuadro verde: toca <b>\"Instalar App\"</b> y confirma. Quedará el ícono <b>Reporte MYC</b> en la pantalla de tu celular."
    ],
    tip: "💡 <b>¿Te salía la pantalla en blanco antes?</b> Mantén presionado el ícono antiguo para eliminarlo de tu pantalla, abre el link en Chrome y vuelve a tocar \"Instalar App\".",
    net: "on",
    phone: `
      <div class="p-card pulse" style="background:#ecfdf5;border:2px solid #10b981;display:flex;justify-content:space-between;align-items:center">
        <div>
          <b style="color:#065f46;font-size:11.5px;display:block">📲 Instalar Aplicación</b>
          <span style="color:#047857;font-size:10.5px">Abrir directo sin navegador</span>
        </div>
        <span style="background:#0f766e;color:#fff;padding:6px 10px;border-radius:7px;font-weight:700;font-size:11px">Instalar App</span>
      </div>
      <div class="p-card" style="text-align:center;padding:18px 10px">
        <div style="font-size:32px;margin-bottom:6px">📲</div>
        <b style="color:#17324d;display:block;margin-bottom:4px">Ícono "Reporte MYC"</b>
        <span style="color:#64748b;font-size:11px">Queda en tu pantalla junto a tus demás aplicaciones para entrar con un toque.</span>
      </div>
    `
  },
  {
    short: "2. Tu Nombre",
    badge: "PASO 2 DE 5 · IDENTIFICACIÓN",
    title: "Escribe tu Nombre y Apellido (Solo la 1ª vez)",
    desc: "El teléfono recordará tu nombre automáticamente para que no tengas que escribirlo en cada trabajo:",
    points: [
      "👷 En la primera casilla <b>\"¿Quién genera el reporte?\"</b>, escribe tu <b>Nombre y Apellido</b>.",
      "💾 Toca el botón <b>\"Guardar en mi teléfono\"</b>.",
      "✅ Tu nombre quedará fijado en una tarjeta azul para todos tus próximos reportes."
    ],
    tip: "💡 Si le prestas el teléfono a otro compañero, puede tocar el botón <b>\"Cambiar nombre\"</b>.",
    net: "on",
    phone: `
      <div class="p-card">
        <div class="p-label">👷 ¿Quién genera el reporte? *</div>
        <div class="p-input">Juan Pérez</div>
        <div class="p-btn-sec">Guardar en mi teléfono</div>
      </div>
      <div style="text-align:center;color:#64748b;font-weight:700;font-size:11px">⬇️ Desde el 2° reporte se ve así ⬇️</div>
      <div class="p-card" style="background:#eef6ff;border:1px solid #93c5fd;display:flex;justify-content:space-between;align-items:center">
        <div>
          <span style="font-size:10px;color:#64748b;display:block">REPORTE GENERADO POR:</span>
          <b style="color:#1e3a8a;font-size:13px">👷 Juan Pérez</b>
        </div>
        <span style="background:#e2e8f0;padding:4px 8px;border-radius:6px;font-size:10.5px;font-weight:700">Cambiar</span>
      </div>
    `
  },
  {
    short: "3. Lugar y Horas",
    badge: "PASO 3 DE 5 · DATOS DE FAENA",
    title: "Completa el Lugar, Horario y Trabajo realizado",
    desc: "Al terminar la faena, ingresa dónde estuvieron, de qué hora a qué hora y qué trabajo se ejecutó:",
    points: [
      "📍 <b>Lugar:</b> Escribe las primeras letras del plantel (ej: <b>tant</b> o <b>bri</b>) y selecciónalo de la lista desplegable. Si es un lugar nuevo, marca <b>\"Otro lugar\"</b>.",
      "🕒 <b>Hora inicio y término:</b> Escribe la hora en formato 24 hrs (ej: escribe <b>0830</b> y se pondrá <b>08:30</b> solo) y la cantidad de <b>Personas en cuadrilla</b>.",
      "📝 <b>Trabajo realizado:</b> Escribe un resumen claro de la tarea realizada."
    ],
    tip: "💡 La fecha de inicio y término se autocompleta con el día de hoy (puedes cambiarla si el trabajo duró más de un día).",
    net: "on",
    phone: `
      <div class="p-card">
        <div class="p-label">Lugar *</div>
        <div class="p-input" style="border-color:#2563eb">STUD TANTEHUE</div>
      </div>
      <div class="p-card">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">
          <div><div class="p-label">Hora inicio *</div><div class="p-input">08:30</div></div>
          <div><div class="p-label">Hora término *</div><div class="p-input">17:30</div></div>
        </div>
        <div class="p-label">Trabajo realizado *</div>
        <div class="p-input" style="min-height:48px;font-weight:400">Mantención y cambio de válvula en matriz...</div>
      </div>
    `
  },
  {
    short: "4. Materiales y Fotos",
    badge: "PASO 4 DE 5 · INSUMOS Y FOTOS",
    title: "Agrega Materiales, Maquinaria y Fotografías",
    desc: "Si ocuparon materiales o equipos, agrégalos uno por uno y adjunta fotos del trabajo:",
    points: [
      "🧱 <b>Materiales:</b> Toca <b>\"+ Agregar material\"</b> y anota Cantidad, Unidad (ej: <i>m, un, sacos</i>) y Descripción.",
      "🚜 <b>Maquinaria / Equipos:</b> Toca <b>\"+ Agregar maquinaria\"</b> y anota las horas/días y qué equipo se usó (ej: <i>Manitú, Retroexcavadora, Termofusionadora</i>).",
      "📷 <b>Fotografías:</b> Adjunta hasta 8 fotos del trabajo. La App las comprime sola para que no gasten tus datos y suban rápido."
    ],
    tip: "💡 Elegir bien las cantidades de materiales y horas de maquinaria ayuda a valorizar el trabajo rápidamente en oficina.",
    net: "on",
    phone: `
      <div class="p-card">
        <div class="p-label">Materiales / Maquinaria</div>
        <div style="display:grid;grid-template-columns:42px 52px 1fr;gap:4px;margin-bottom:6px">
          <div class="p-input">6</div>
          <div class="p-input">hrs</div>
          <div class="p-input">Retroexcavadora</div>
        </div>
        <div class="p-btn-sec">+ Agregar maquinaria</div>
      </div>
      <div class="p-card">
        <div class="p-label">📷 Fotografías (hasta 8 fotos)</div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <div style="width:52px;height:52px;background:#cbd5e1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px">FOTO 1</div>
          <div style="width:52px;height:52px;background:#cbd5e1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px">FOTO 2</div>
        </div>
      </div>
    `
  },
  {
    short: "5. Envío Sin Señal",
    badge: "PASO 5 DE 5 · ENVÍO CON O SIN SEÑAL",
    title: "Presiona ENVIAR REPORTE (aunque no tengas señal)",
    desc: "No esperes a llegar a tu casa para hacer el reporte. Envíalo apenas termines en el plantel:",
    points: [
      "🟢 <b>Con señal:</b> El reporte llega de inmediato a recepción central y te muestra el folio (ej: <b>✓ Reporte RT-0008 recibido</b>).",
      "🟠 <b>Sin señal de celular:</b> Presiona <b>\"ENVIAR REPORTE\"</b> igual. El reporte y sus fotos quedan guardados en la memoria interna de tu teléfono.",
      "🔄 <b>Envío automático:</b> Apenas tu teléfono recupere señal en el camino, el reporte se enviará solo a la central."
    ],
    tip: "✅ <b>Listo:</b> Puedes verificar abajo en <i>\"Reportes pendientes en este teléfono\"</i> que cuando ya se envió dice <b>\"Sin pendientes\"</b>.",
    net: "off",
    phone: `
      <div class="p-btn pulse">ENVIAR REPORTE</div>
      <div class="p-card" style="background:#fef3c7;border:1px solid #f59e0b;color:#78350f;font-size:11.5px;line-height:1.35">
        <b>📵 Guardado en el teléfono (2 fotos incluidas).</b><br>Se enviará automáticamente apenas vuelva la señal.
      </div>
      <div class="p-card">
        <div class="p-label">Reportes pendientes en este teléfono</div>
        <div style="font-size:11px;color:#334155"><b>STUD TANTEHUE</b> · <span style="background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:99px;font-weight:700">⏳ Pendiente de señal</span></div>
      </div>
    `
  }
];

let idx = 0;
let autoTimer = null;

function renderSlide() {
  const s = SLIDES[idx];
  document.getElementById("sBadge").textContent = s.badge;
  document.getElementById("sTitle").textContent = s.title;
  document.getElementById("sDesc").textContent = s.desc;
  document.getElementById("sPoints").innerHTML = s.points.map(p => `<div class="point">${p}</div>`).join("");
  document.getElementById("sTip").innerHTML = s.tip;
  document.getElementById("pBody").innerHTML = s.phone;
  document.getElementById("counterTxt").textContent = `Paso ${idx + 1} de ${SLIDES.length}`;

  const net = document.getElementById("pNet");
  if (s.net === "off") {
    net.textContent = "🟠 Sin señal";
    net.className = "p-net off";
  } else {
    net.textContent = "🟢 En línea";
    net.className = "p-net";
  }

  document.getElementById("pills").innerHTML = SLIDES.map((item, i) =>
    `<div class="step-pill ${i === idx ? "active" : ""}" onclick="go(${i})">${item.short}</div>`
  ).join("");
}

function next() {
  idx = (idx + 1) % SLIDES.length;
  renderSlide();
}
function prev() {
  idx = (idx - 1 + SLIDES.length) % SLIDES.length;
  renderSlide();
}
function go(i) {
  idx = i;
  renderSlide();
}
function toggleAutoPlay() {
  const b = document.getElementById("playBtn");
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    b.textContent = "▶️ Ver como Video (Automático)";
  } else {
    b.textContent = "⏸️ Pausar presentación";
    autoTimer = setInterval(next, 6000);
  }
}

document.getElementById("printStepsContainer").innerHTML = SLIDES.map(s => `
  <div class="print-step">
    <h3>${s.badge} — ${s.title}</h3>
    <p style="margin:0 0 6px;font-size:13px">${s.desc}</p>
    <ul>${s.points.map(p => `<li>${p}</li>`).join("")}</ul>
    <div style="font-size:12.5px;color:#334155;margin-top:6px">${s.tip}</div>
  </div>
`).join("");

renderSlide();
</script>
</body>
</html>
